name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows:
      - Tests
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    name: Merge passing Dependabot PR
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Verify and merge Dependabot PR
        uses: actions/github-script@v9
        with:
          script: |
            const run = context.payload.workflow_run;
            const linkedPullRequests = run.pull_requests;

            if (linkedPullRequests.length !== 1) {
              core.setFailed(`Expected one linked pull request, found ${linkedPullRequests.length}.`);
              return;
            }

            const pullNumber = linkedPullRequests[0].number;
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
            });

            if (pull.user.login !== 'dependabot[bot]') {
              core.setFailed(`Pull request #${pullNumber} was not opened by Dependabot.`);
              return;
            }

            if (pull.base.ref !== 'master') {
              core.setFailed(`Pull request #${pullNumber} targets ${pull.base.ref}, not master.`);
              return;
            }

            if (pull.head.sha !== run.head_sha) {
              core.setFailed(`Pull request #${pullNumber} changed after the successful test run.`);
              return;
            }

            if (pull.state !== 'open' || pull.draft) {
              core.info(`Pull request #${pullNumber} is not an open, ready-for-review PR.`);
              return;
            }

            const { data: result } = await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pullNumber,
              sha: run.head_sha,
              merge_method: 'merge',
            });

            if (!result.merged) {
              core.setFailed(result.message || `GitHub could not merge pull request #${pullNumber}.`);
              return;
            }

            core.notice(`Merged passing Dependabot pull request #${pullNumber}.`);
